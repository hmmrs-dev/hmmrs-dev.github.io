title: hmmrs.dev
description: Apps by hmmrs.dev.
url: https://hmmrs.dev
baseurl: ""

# Public contact for the privacy policies and the Play Store listings
contact_email: support@hmmrs.dev
developer: Enrico Martelli

# Each app's listing on Google Play, which its Get it on Google Play badges link to
google_play:
  turno: https://play.google.com/store/apps/details?id=dev.hmmrs.turno

defaults:
  - scope:
      path: ""
    values:
      layout: default
      lang: en
  - scope:
      path: turno
    values:
      brand: Turno
      theme: tavola
      stylesheets: [/turno/assets/tavola.css]
      brand_icon: /turno/assets/icon-192.png
      favicon: /turno/assets/favicon.ico
      apple_touch_icon: /turno/assets/apple-touch-icon.png

plugins:
  - jekyll-sitemap

include:
  - .well-known

exclude:
  - README.md
